<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>澳門消費券大獎賞 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24 relative min-h-screen">

    <!-- 頂部導航 -->
    <header class="bg-gradient-to-r from-red-600 to-red-800 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center">澳門消費券大獎賞 2026</h1>
        <p class="text-center text-xs text-red-200 mt-1">三倍核銷記帳神器</p>
    </header>

    <!-- 提示訊息 -->
    <div id="notification" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg z-50 text-sm hide transition-opacity"></div>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- 控制面板 -->
        <div class="bg-white rounded-xl shadow-sm p-4 space-y-4 border border-gray-100">
            <div class="flex space-x-2">
                <button id="btn-owner-me" onclick="setOwner('我')" class="flex-1 py-2 rounded-lg text-sm font-medium transition-colors bg-red-100 text-red-700 border border-red-200">我的記錄</button>
                <button id="btn-owner-family" onclick="setOwner('家人')" class="flex-1 py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600">家人的記錄</button>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">選擇活動週次</label>
                <select id="week-selector" onchange="setWeek(this.value)" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                    <option value="1">第1週 (10/09 - 10/15)</option>
                    <option value="2">第2週 (10/16 - 10/22)</option>
                    <option value="3">第3週 (10/23 - 10/29)</option>
                    <option value="4">第4週 (10/30 - 11/05)</option>
                    <option value="5">第5週 (11/06 - 11/12)</option>
                    <option value="6">第6週 (11/13 - 11/19)</option>
                    <option value="7">第7週 (11/20 - 11/26)</option>
                    <option value="8">第8週 (11/27 - 12/03)</option>
                    <option value="9">第9週 (12/04 - 12/10)</option>
                    <option value="10">第10週 (12/11 - 12/17)</option>
                </select>
            </div>
        </div>

        <!-- 統計表 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
            <div class="bg-red-50 p-3 border-b border-red-100 flex justify-between items-center">
                <h2 class="font-bold text-red-800 text-sm">本週可用券統計 (未使用)</h2>
                <div class="text-right">
                    <p class="text-xs text-gray-500">總需消費</p>
                    <p class="font-bold text-red-600" id="grand-total-spend">MOP 0</p>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="px-4 py-3 font-medium">平台</th>
                            <th class="px-4 py-3 font-medium text-center">可用券</th>
                            <th class="px-4 py-3 font-medium text-right">券總額</th>
                            <th class="px-4 py-3 font-medium text-right">需消費</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body" class="divide-y divide-gray-100">
                        <!-- 統計數據由 JS 產生 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 詳細列表 -->
        <div class="space-y-3">
            <h3 class="font-bold text-gray-700 text-sm px-1">詳細記錄 (點擊圓圈標記使用)</h3>
            <div id="voucher-list" class="space-y-3">
                <!-- 列表由 JS 產生 -->
            </div>
        </div>

        <!-- 分享按鈕 -->
        <button onclick="generateShareLink()" class="w-full flex items-center justify-center space-x-2 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl shadow-sm hover:bg-gray-50 transition-colors">
            <i class="fa-solid fa-share-nodes"></i>
            <span class="font-medium" id="share-text">產生分享連結給家人</span>
        </button>

    </main>

    <!-- 懸浮新增按鈕 -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 bg-red-600 text-white w-14 h-14 rounded-full shadow-lg hover:bg-red-700 transition-transform transform hover:scale-105 z-20 flex items-center justify-center">
        <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <!-- 新增券 Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hide">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-xl">
            <div class="bg-red-50 p-4 border-b border-red-100 flex justify-between items-center">
                <h3 class="font-bold text-red-800">新增抽獎記錄</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">支付平台</label>
                    <div class="grid grid-cols-4 gap-2" id="platform-btns">
                        <!-- 由 JS 產生 -->
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">抽中金額 (MOP)</label>
                    <div class="grid grid-cols-3 gap-2" id="amount-btns">
                        <!-- 由 JS 產生 -->
                    </div>
                </div>

                <button onclick="handleAddVoucher()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl mt-4 hover:bg-red-700 transition-colors">
                    確認新增
                </button>
            </div>
        </div>
    </div>

    <script>
        // 狀態變數
        let vouchers = [];
        let currentOwner = '我';
        let currentWeek = 1;
        let formPlatform = 'BOC';
        let formAmount = 10;

        const PLATFORMS = ['BOC', 'ICBC', 'LUSO', 'MPay', 'CGB', 'UePay', 'TFB', 'AliPay'];
        const AMOUNTS = [0, 10, 20, 50, 100, 200];

        // 初始化
        function init() {
            // 嘗試從 URL Hash 讀取分享資料
            const hash = window.location.hash;
            if (hash && hash.startsWith('#data=')) {
                try {
                    const encodedData = hash.replace('#data=', '');
                    vouchers = JSON.parse(decodeURIComponent(atob(encodedData)));
                    window.location.hash = '';
                    saveData();
                    showNotification('成功載入分享的數據！');
                } catch (e) {
                    console.error('解析分享連結失敗', e);
                }
            } else {
                loadData();
            }

            renderModalButtons();
            render();
        }

        // 資料存取 (安全模式，避免沙盒報錯)
        function saveData() {
            try {
                localStorage.setItem('macau_vouchers_2026', JSON.stringify(vouchers));
            } catch (e) { console.log('LocalStorage 不可用，僅保存在記憶體中'); }
        }

        function loadData() {
            try {
                const data = localStorage.getItem('macau_vouchers_2026');
                if (data) vouchers = JSON.parse(data);
            } catch (e) { console.log('LocalStorage 不可用'); }
        }

        // UI 互動
        function setOwner(owner) {
            currentOwner = owner;
            document.getElementById('btn-owner-me').className = `flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${owner === '我' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-gray-100 text-gray-600'}`;
            document.getElementById('btn-owner-family').className = `flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${owner === '家人' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-gray-100 text-gray-600'}`;
            render();
        }

        function setWeek(week) {
            currentWeek = Number(week);
            render();
        }

        function openModal() { document.getElementById('add-modal').classList.remove('hide'); }
        function closeModal() { document.getElementById('add-modal').classList.add('hide'); }

        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.remove('hide');
            setTimeout(() => el.classList.add('hide'), 3000);
        }

        // Modal 按鈕渲染
        function renderModalButtons() {
            const pContainer = document.getElementById('platform-btns');
            pContainer.innerHTML = PLATFORMS.map(p => `
                <button onclick="formPlatform='${p}'; renderModalButtons()" class="py-2 text-xs font-medium rounded-lg border ${formPlatform === p ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-600 border-gray-200'}">${p}</button>
            `).join('');

            const aContainer = document.getElementById('amount-btns');
            aContainer.innerHTML = AMOUNTS.map(a => `
                <button onclick="formAmount=${a}; renderModalButtons()" class="py-2 text-sm font-medium rounded-lg border ${formAmount === a ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-600 border-gray-200'}">${a === 0 ? '0 (未中)' : a}</button>
            `).join('');
        }

        // 新增券
        function handleAddVoucher() {
            vouchers.push({
                id: Date.now().toString(),
                platform: formPlatform,
                amount: formAmount,
                week: currentWeek,
                owner: currentOwner,
                isUsed: false
            });
            saveData();
            closeModal();
            render();
        }

        // 切換狀態與刪除
        function toggleUse(id) {
            const v = vouchers.find(v => v.id === id);
            if(v) { v.isUsed = !v.isUsed; saveData(); render(); }
        }

        function deleteVoucher(id) {
            vouchers = vouchers.filter(v => v.id !== id);
            saveData();
            render();
        }

        // 產生分享連結
        function generateShareLink() {
            try {
                const dataString = btoa(encodeURIComponent(JSON.stringify(vouchers)));
                const url = `${window.location.origin}${window.location.pathname}#data=${dataString}`;
                navigator.clipboard.writeText(url).then(() => {
                    const btnText = document.getElementById('share-text');
                    btnText.textContent = '連結已複製！請發送給家人';
                    setTimeout(() => btnText.textContent = '產生分享連結給家人', 3000);
                });
            } catch (err) {
                showNotification('複製失敗，請手動複製網址');
            }
        }

        // 核心渲染邏輯
        function render() {
            const currentVouchers = vouchers.filter(v => v.week === currentWeek && v.owner === currentOwner);
            
            // 統計
            let stats = {};
            PLATFORMS.forEach(p => stats[p] = { amount: 0, spend: 0, count: 0 });
            let grandSpend = 0;
            let grandAmount = 0;

            currentVouchers.forEach(v => {
                if(v.amount > 0 && !v.isUsed) {
                    stats[v.platform].amount += v.amount;
                    stats[v.platform].spend += (v.amount * 3);
                    stats[v.platform].count += 1;
                    grandSpend += (v.amount * 3);
                    grandAmount += v.amount;
                }
            });

            document.getElementById('grand-total-spend').textContent = `MOP ${grandSpend}`;

            const statsBody = document.getElementById('stats-body');
            if(grandAmount === 0) {
                statsBody.innerHTML = `<tr><td colSpan="4" class="px-4 py-8 text-center text-gray-400 text-sm">本週暫無未使用的消費券</td></tr>`;
            } else {
                statsBody.innerHTML = PLATFORMS.map(p => {
                    if(stats[p].count === 0) return '';
                    return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-semibold text-gray-700">${p}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-red-100 text-red-700 py-1 px-2 rounded-full text-xs font-bold">${stats[p].count} 張</span></td>
                        <td class="px-4 py-3 text-right font-medium text-gray-800">${stats[p].amount}</td>
                        <td class="px-4 py-3 text-right font-bold text-red-600">${stats[p].spend}</td>
                    </tr>`;
                }).join('');
            }

            // 列表
            const listEl = document.getElementById('voucher-list');
            if(currentVouchers.length === 0) {
                listEl.innerHTML = `
                <div class="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300">
                    <i class="fa-solid fa-circle-exclamation text-3xl text-gray-300 mb-2"></i>
                    <p class="text-gray-400 text-sm">此週次尚未添加任何記錄</p>
                </div>`;
            } else {
                listEl.innerHTML = currentVouchers.slice().reverse().map(v => `
                <div class="flex items-center justify-between p-4 rounded-xl border ${v.isUsed ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-white border-red-100 shadow-sm'}">
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleUse('${v.id}')" class="focus:outline-none text-2xl">
                            ${v.isUsed ? '<i class="fa-solid fa-circle-check text-gray-400"></i>' : '<i class="fa-regular fa-circle text-red-500"></i>'}
                        </button>
                        <div>
                            <p class="font-bold ${v.isUsed ? 'text-gray-500 line-through' : 'text-gray-800'}">
                                ${v.platform} - ${v.amount === 0 ? '未中獎 (0元)' : v.amount + '元券'}
                            </p>
                            ${v.amount > 0 && !v.isUsed ? `<p class="text-xs text-red-500 mt-0.5">需消費 MOP ${v.amount * 3}</p>` : ''}
                            ${v.isUsed ? `<p class="text-xs text-gray-400 mt-0.5">已核銷</p>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteVoucher('${v.id}')" class="p-2 text-gray-300 hover:text-red-500 transition-colors">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>`).join('');
            }
        }

        // 啟動
        init();
    </script>
</body>
</html>
